name: Publish WaterFlow ACTL image

# Builds the ACTL overlay (Dockerfile.astera) on a GitHub-hosted runner,
# smoke-tests it, and pushes diffuse/waterflow:sha-<commit> to Astera's Harbor,
# the image the actl `waterflow` catalog entry pins by digest.
#
# Harbor is reachable only over Astera's tailnet: the job joins it as an
# ephemeral tag:ci-n device through the `harbor-publish` environment's
# Tailscale trust credential (TS_CI_CLIENT_ID, TS_CI_AUDIENCE), which can reach
# Harbor and nothing else, and pushes with the environment's Harbor robot
# (HARBOR_USERNAME, HARBOR_PASSWORD). The base image is private on Docker Hub,
# so the environment also holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
#
# The registry host is the environment secret ASTERA_REGISTRY, not a literal:
# this repository and its Actions logs are public, and only secrets are masked.
#
# No pull_request trigger: astera-docker.yml validates the overlay on PRs, and
# the environment is deployable from main only. Tags in the `diffuse` project
# are immutable, so each commit is pushed once, under sha-<commit>.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.astera
      - docker/actl-*
      - docker/entrypoint.sh
      - pyproject.toml
      - uv.lock
      - .github/workflows/astera-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: harbor-publish
    timeout-minutes: 90
    env:
      ASTERA_REGISTRY: ${{ secrets.ASTERA_REGISTRY }}
      IMAGE_NAME: diffuse/waterflow
    steps:
      # The Harbor credentials are sent to whatever host this names, so an empty
      # value (login-action then defaults to Docker Hub) or a public registry
      # would hand them to a third party.
      - name: Validate Astera registry configured
        run: |
          if [ -z "${ASTERA_REGISTRY}" ]; then
            echo "ASTERA_REGISTRY environment secret must be set."
            exit 1
          fi
          case "${ASTERA_REGISTRY}" in
            docker.io|index.docker.io|registry-1.docker.io)
              echo "ASTERA_REGISTRY must be the internal registry, not a public one."
              exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The base carries CUDA and the ESM3 cache; the runner's default free
      # space is not enough.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift || true
          docker system prune -af || true
          df -h /

      - name: Log in to Docker Hub (private base)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build overlay
        run: |
          docker build \
            --file Dockerfile.astera \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag waterflow-actl:ci \
            .

      - name: Smoke test
        run: |
          set -euo pipefail
          image=waterflow-actl:ci
          docker run --rm --entrypoint bash "$image" -lc '
            test -L /data
            test "$(readlink /data)" = /mnt/diffuse-shared/waterflow
            test -x /usr/local/bin/waterflow
            python -c "import sklearn; import src.utils"
          '
          for cmd in "" train inference generate-esm; do
            # shellcheck disable=SC2086 # empty $cmd must vanish
            docker run --rm -v "${GITHUB_WORKSPACE}:/home/dev/workspace:ro" "$image" waterflow $cmd --help >/dev/null
          done

      - name: Join Astera tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n

      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${ASTERA_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::Astera registry unreachable over the tailnet"; exit 1

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ASTERA_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push
        run: |
          set -euo pipefail
          tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          ref="${ASTERA_REGISTRY}/${tag}"
          docker tag waterflow-actl:ci "$ref"
          docker push "$ref"
          pinned="$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")"
          # The registry host is masked in public logs, so the summary names the
          # repository path only.
          {
            echo "Pushed \`${tag}\`"
            echo
            echo "actl catalog ref (prefix the Astera registry host): \`${tag}@${pinned#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"
